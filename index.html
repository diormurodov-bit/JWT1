<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="card">
    <h1>Вход</h1>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Логин</label>
        <input id="username" type="text" autocomplete="username" placeholder="emilys" />
        <div class="field-error" id="username-error"></div>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="emilyspass" />
        <div class="field-error" id="password-error"></div>
      </div>

      <div class="form-error" id="form-error"></div>

      <button id="submit-btn" class="btn" type="submit">Войти</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
